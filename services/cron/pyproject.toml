[project]
name = "app-cron"
version = "0.1.0"
description = "Scheduled ingestion and maintenance jobs. No HTTP surface."
requires-python = ">=3.12"

dependencies = [
    "apscheduler>=3.11",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
